<!doctype html>
<html lang="fr" data-theme="itu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ITU Project — Back Office GLPI" />
    <title>ITU Project</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.22/dist/full.min.css" rel="stylesheet">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'itu-bg':      '#f2f5fa',
              'itu-surface': '#ffffff',
              'itu-border':  '#d0d7e1',
              'itu-section': '#f1f4f9',
              'itu-hover':   '#ecedf5',
              'itu-primary': '#4f46e5',
              'itu-pri-lt':  '#eef2ff',
              'itu-text':    '#1e293b',
              'itu-muted':   '#64748b',
            },
            fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
            boxShadow: {
              'card':      '0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04)',
              'card-hover':'0 4px 12px rgba(0,0,0,.09),0 8px 24px rgba(0,0,0,.06)',
            }
          }
        }
      }
    </script>

    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Inter',system-ui,sans-serif;background:#f2f5fa;color:#1e293b;-webkit-font-smoothing:antialiased}
      ::-webkit-scrollbar{width:6px;height:6px}
      ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:#d0d7e1;border-radius:99px}
      ::-webkit-scrollbar-thumb:hover{background:#b0bac9}
      a,button{transition:all .15s ease}
      /* disable daisyui base overrides on non-daisy elements */
      [data-theme="itu"]{color-scheme:light}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
